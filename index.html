<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Ontology Coder (v4 pilot)</title>
<style>
  :root{
    --paper:#F3F1EA; --paper-raised:#FBFAF6; --ink:#1E2A22; --ink-soft:#4A564C;
    --rule:#C9C3B4; --accent:#2F4D63; --accent-soft:#DCE6EA; --flag:#9A5B2E;
    --flag-soft:#F3E3D3; --good:#3C6E4E; --good-soft:#E2EDE5;
  }
  :root{color-scheme:light;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;line-height:1.5;}
  .ui, button, input, select, textarea{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  #app{max-width:760px;margin:0 auto;padding:24px 16px 90px;}
  header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:18px;}
  header.top h1{font-size:1.1rem;font-weight:normal;margin:0;}
  header.top .meta{font-size:.78rem;color:var(--ink-soft);}
  .card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:3px;padding:18px 20px;margin-bottom:16px;}
  .seg{font-size:1.18rem;line-height:1.6;user-select:text;}
  .card.stick{position:sticky;top:0;z-index:20;box-shadow:0 4px 10px rgba(0,0,0,.12);border-color:var(--accent);margin-top:0;}
  .lbl{font-size:.72rem;color:var(--ink-soft);margin-bottom:6px;}
  .tag{display:inline-block;font-size:.74rem;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:1px 7px;margin-bottom:10px;}
  button{font-size:.9rem;border-radius:3px;border:1px solid var(--accent);background:var(--paper-raised);color:var(--accent);padding:8px 16px;cursor:pointer;}
  button.primary{background:var(--accent);color:var(--paper-raised);}
  button.ghost{border-color:var(--rule);color:var(--ink-soft);}
  button.small{padding:3px 9px;font-size:.78rem;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .field{padding:9px 0;border-top:1px solid var(--rule);}
  .field:first-of-type{border-top:none;}
  .fhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .fname{font-size:.92rem;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}
  .prov{color:var(--flag);margin-left:2px;}
  .info{font-size:.78rem;color:var(--accent);cursor:pointer;background:none;border:none;padding:0 4px;text-decoration:underline;}
  .defn{font-size:.82rem;color:var(--ink-soft);background:var(--accent-soft);border-radius:3px;padding:8px 10px;margin-top:6px;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}
  .defn b{color:var(--ink);}
  .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .opt{position:relative;}
  .opt input{position:absolute;opacity:0;pointer-events:none;}
  .opt span{display:inline-block;border:1px solid var(--rule);border-radius:3px;padding:4px 12px;font-size:.86rem;cursor:pointer;background:var(--paper-raised);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}
  .opt input:checked + span{background:var(--accent);color:var(--paper-raised);border-color:var(--accent);}
  .opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px;}
  .opt.yes input:checked + span{background:var(--good);border-color:var(--good);}
  input[type=text],select,textarea{width:100%;font-size:.92rem;padding:7px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-raised);color:var(--ink);}
  textarea{min-height:60px;resize:vertical;}
  .gated{border-left:3px solid var(--accent);padding-left:12px;margin:6px 0 0 2px;}
  .actor{border:1px solid var(--accent);}
  .actorhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .warn{background:var(--flag-soft);color:var(--ink);border-left:3px solid var(--flag);padding:8px 12px;font-size:.86rem;margin:10px 0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}
  .warn ul{margin:4px 0 0 18px;padding:0;}
  .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:6px 0 0;}
  .bar i{display:block;height:100%;background:var(--good);}
  table.list{width:100%;border-collapse:collapse;font-size:.84rem;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}
  table.list td,table.list th{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top;}
  table.list tr.go{cursor:pointer;} table.list tr.go:hover{background:var(--accent-soft);}
  .done{color:var(--good);} .todo{color:var(--ink-soft);}
  .small{font-size:.8rem;color:var(--ink-soft);}
  a{color:var(--accent);cursor:pointer;}
  .secnote{font-size:.8rem;color:var(--ink-soft);margin:-4px 0 8px;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}
</style>
</head>
<body>
<div id="app" class="ui"></div>

<script>
/* =====================================================================
   EDIT HERE. Everything the coder sees comes from these lists.
   prov:1 marks fields the guide still shows with a dagger (not final).
   To change a value list, wording, or add a field, edit this block only.
   Field ids become the CSV column names.
   ===================================================================== */
const GUIDE_VERSION = 'Coder Guide v4 (draft)';

const ROLES = [
  'spouse','partner','ex-partner','child','son','daughter','parent','mother','father',
  'grandmother','grandfather','sibling','brother','sister','sister-in-law','mother-in-law',
  'cousin','aunt','uncle','nephew','niece','roommate','neighbor','friend','old friend',
  'classmate','teammate','coworker','supervisor','boss','therapist','case manager','sponsor',
  'peer group member','online recovery buddy','faith leader','mentor','nurse','pharmacist',
  'coach','barber',
  'doctor',            // ADDED by tool: guide uses "my doctor" as an example, v3 list has no doctor. Confirm with Joe.
  'Unspecified','Other_Role'
];

const YN = ['Yes','No'];
const CARE_TYPES = [
  {id:'Care_Emotional', label:'Emotional', prov:1,
   def:'Comfort, listening, encouragement, expressed love or concern, or presence offered for feelings.',
   when:'Yes when the care consists of emotional support for how the person feels.'},
  {id:'Care_Instrumental', label:'Instrumental', prov:1,
   def:'Practical or material help: rides, meals, money, chores, errands, childcare for a capable adult.',
   when:'Yes when the care is a concrete practical act or resource.'},
  {id:'Care_Informational', label:'Informational', prov:1,
   def:'Advice, explanation, referral, teaching, or guidance about how to do something or what to expect.',
   when:'Yes when the care consists of giving the diarist knowledge or direction (or the diarist giving it to the actor).'},
  {id:'Care_Health_Related', label:'Health_Related', prov:1,
   def:'Care that addresses a health condition, symptoms, treatment, or recovery: caring for someone who is sick, attending appointments, helping through withdrawal.',
   when:'Yes when the text ties the care to health, illness, treatment, or recovery. Can be Yes alongside Instrumental, Informational, or Emotional.'},
  {id:'Care_Identity_Affirming', label:'Identity_Affirming', prov:1,
   def:"Affirming the person's worth, identity, or belonging as who they are: using the right name, introducing them as themselves, telling them they belong.",
   when:'Yes when the act or words affirm identity or worth specifically.'},
  {id:'Care_Boundary_Setting', label:'Boundary_Setting', prov:1,
   def:'Setting, holding, or honoring a limit in order to protect someone’s wellbeing or the relationship.',
   when:'Yes when a limit is set or respected for protective reasons, by either party.'},
  {id:'Care_Monitoring', label:'Monitoring', prov:1,
   def:'Checking on, keeping track of, or watching for risk: confirming safety, whether the person is taking medication, drinking, or eating.',
   when:'Yes when the act is about checking status or safety.'},
  {id:'Care_Dependent_Care', label:'Dependent_Care', prov:1,
   def:'Ongoing care for someone who cannot fully care for themselves: a young child, a frail or ill relative.',
   when:'Yes when the care is feeding, bathing, supervising, or managing the daily needs of a dependent.'},
  {id:'Care_Other', label:'Other_Care', prov:1,
   def:'Clearly care, but fits none of the other eight types. Should be rare.',
   when:'Yes only after checking the other eight and finding none fits. Describe it in Coder_Notes.'}
];
const DOMAINS = [
  ['Safety','Risk of physical harm to self or others: self-harm urges, violence, abuse, an unsafe situation.'],
  ['Treatment_Engagement','Starting, attending, continuing, or avoiding therapy, appointments, programs, or clinicians (not medication specifically).'],
  ['Medication_Adherence','Taking, skipping, refilling, or having problems with medication.'],
  ['Sobriety','Alcohol or drug use, cravings, abstinence, or recovery activity.'],
  ['Emotional_Regulation','Managing mood, panic, anger, anxiety, or distress; calming down or failing to.'],
  ['Belonging','Connection, loneliness, acceptance, exclusion, or feeling part of a group or relationship.'],
  ['Daily_Functioning','Routines and self-care tasks: getting up, showering, eating, work or school attendance, chores.'],
  ['Financial_Material','Money, bills, food, transport, or other material resources.'],
  ['Housing','Where the person lives or may live: rent, eviction, homelessness, moving, unstable shelter.'],
  ['Parenting','Raising or caring for one’s own child, or parenting strain and support.'],
  ['Sleep','Sleeping too little or too much, insomnia, sleep schedule, or rest.'],
  ['Body_Image_Eating','Body image, weight, eating, bingeing, restricting, or shame about food or the body.'],
  ['Other_Domain','A clear viability concern not covered above (for example employment or education).']
];

/* Segment-level fields (coded once per segment, copied to every row of that segment) */
const SEG_FIELDS = [
  {id:'Collective_Mentioned', type:'yn',
   def:'The segment refers to a specific group of people as a group (my family, the nurses, everyone at work).',
   when:'Yes when a named or bounded group is referred to as a group, whether or not an individual is also singled out.'},
  {id:'Generalized_Other_Mentioned', type:'yn',
   def:"The segment uses a universal, negated, or indefinite plural reference to people that names no individual or bounded group ('no one', 'nobody', 'people', 'everyone' with no group).",
   when:'Yes when such a reference is present. These segments get a placeholder row and go to second-pass coding.'}
];

/* Actor-level fields, in the order shown. type: text | role | yn | enum
   gate: id of a Yes/No field that must be Yes for this field to be coded. */
const FIELDS = [
  {sec:'A', secTitle:'A. Who is the actor', secNote:'Decide who gets a row first. One row per individual person. The diarist never gets a row.'},
  {id:'Actor_Mention', type:'text', req:1,
   def:'The exact words the segment uses to refer to the actor, copied as written, including possessives and any name.',
   when:"Copy the fullest reference (e.g., 'My wife, Kim'). Pronoun-only references are copied as written ('She'). Tip: select the words in the segment above, then press 'Use selected text'."},
  {id:'Actor_Name', type:'text',
   def:"The person's given name, nickname, or titled name exactly as written in the segment.",
   when:'Fill only when the segment contains a name for the actor. Otherwise leave blank.'},
  {id:'Actor_Role', type:'role', req:1,
   def:"The actor's relationship to the diarist, as stated in the segment.",
   when:'Choose the list value that matches the role words. Use Unspecified when the segment states no role.'},

  {sec:'B', secTitle:'B. Cues about the relationship', secNote:'Independent Yes/No flags, coded for every actor row. Default is No.'},
  {id:'Bond_Evidence_Present', type:'yn', prov:1,
   def:'The segment directly names or clearly intimates a close or ongoing tie between the diarist and this actor. About the relationship only; says nothing about whether care is present.',
   when:"Yes when the words show: a close-relationship term (spouse, partner, parent, child, sibling, closest friend, sponsor); shared-history language ('since college', 'reminiscing for hours'); or attachment language (love, miss, rely on)."},
  {id:'Recurrence_Cue', type:'yn',
   def:"The segment contains an explicit word or phrase of repetition or history about the diarist's contact or relationship with the actor.",
   when:"Yes only for explicit cues: again, still, always, every (day/week), keeps, lately, as usual, once more, 'since we were kids'."},
  {id:'Assumption_Present', type:'yn', notes:1,
   def:'The diarist states a belief about what the actor thinks, feels, or intends, and the segment does not show the actor saying or doing it.',
   when:"Yes for positive or negative beliefs about the actor's inner state ('I'm sure she thinks...', 'I know he loves me')."},
  {id:'Actor_as_Trigger', type:'yn', notes:1,
   def:"The diarist attributes distress, an urge, or a symptom to the actor's presence, action, or mention, whether or not the actor did anything wrong.",
   when:"Yes when the segment links a negative state to the actor ('set off', 'every time he calls', 'seeing her made me')."},

  {sec:'C', secTitle:'C. Care', secNote:'Code Care_Content_Present first. Polarity, direction and the nine care types appear only when it is Yes; otherwise they stay blank.'},
  {id:'Care_Content_Present', type:'yn', prov:1, notes:1,
   def:"The segment describes care between the diarist and this actor: an act or expressed concern aimed at someone's wellbeing, whether given, received, or described as missing. Past and remembered care count.",
   when:'Yes when the words show an act or orientation aimed at the other person’s wellbeing, or an explicit wish for or complaint about its absence.'},
  {id:'Care_Polarity', type:'enum', values:['Enacted','Absent_or_Unmet','Both'], gate:'Care_Content_Present', prov:1, req:1,
   def:'Whether the care in the segment was actually given, or is wished for, expected, or described as missing.',
   when:"Enacted when care is shown as given. Absent_or_Unmet requires an explicit cue: wish, never, didn't, no one, 'should have', 'expected'. Both when the same actor's care is shown as partly given and partly missing."},
  {id:'Edge_Direction', type:'enum', values:['Actor_to_Diarist','Diarist_to_Actor','Reciprocal','Unclear'], gate:'Care_Content_Present', req:1,
   def:'Which way the care in the segment runs.',
   when:'Actor_to_Diarist when the actor gives (or fails to give) care to the diarist. Diarist_to_Actor for the reverse. Reciprocal only when both directions are explicit in the same segment.'},
  ...CARE_TYPES.map(c => ({id:c.id, label:'Care type: '+c.label, type:'yn', gate:'Care_Content_Present', prov:c.prov, def:c.def, when:c.when, careType:1})),

  {sec:'D', secTitle:'D. Actor behavior and relationship events', secNote:'Coded for every actor row.'},
  {id:'Actor_Behavior_Valence', type:'enum', values:['Supportive','Harmful','Mixed','Neutral','Unclear'], prov:1, req:1,
   def:"How the actor's own reported behavior toward the diarist reads, judged on the actor's behavior only, not on the diarist's reaction.",
   when:'Supportive for helpful or caring behavior; Harmful for hurtful, hostile, or neglectful behavior as described; Mixed when both appear for the same actor; Neutral when no evaluative content; Unclear only when the text points both ways without a clear read.'},
  {id:'Rupture', type:'yn', notes:1,
   def:'The segment shows a break, strain, or breach between the diarist and this actor: abandonment, withdrawal, betrayal, conflict, secrecy, or disconnection. Past events count.',
   when:'Yes when any of the six forms is shown in the words.'},
  {id:'Repair', type:'yn', notes:1,
   def:'The segment shows an apology, truth-telling, reconnection, renegotiation, or renewed commitment between the diarist and this actor. Attempts count; past events count.',
   when:'Yes when any of the five forms is shown in the words, even if the response is not shown.'},

  {sec:'E', secTitle:'E. Viability domains', secNote:'Thirteen independent Yes/No flags for every actor row. Several can be Yes. No primary domain. Yes only when the words in the segment show the domain.'},
  ...DOMAINS.map(d => ({id:'Dom_'+d[0], label:d[0], type:'yn', prov:1, def:d[1], when:'The words in the segment touch this domain.', domain:1})),

  {sec:'F', secTitle:'F. Time and notes', secNote:'Coded for every actor row.'},
  {id:'Time_Frame', type:'enum', values:['Current','Past','Unclear'], req:1,
   def:'When the actor-relevant event in the segment occurs relative to the diarist’s writing.',
   when:'Current for present or habitual events. Past for completed or remembered events. Unclear when mixed or hypothetical.'},
  {id:'Coder_Notes', type:'area',
   def:"Short quoted phrases that support a Yes on any flag, plus the actor's role when coded Other_Role.",
   when:'Quote the minimal phrase that triggered each Yes for Care_Content_Present, Rupture, Repair, Actor_as_Trigger, and Assumption_Present.'}
];
const ACTOR_FIELDS = FIELDS.filter(f => f.id);
const NOTES_FIELDS = ACTOR_FIELDS.filter(f => f.notes).map(f => f.id);

/* Demo segments: invented, for practice only. Not diary text. */
const DEMO = [
  {segment_id:'DEMO-001', entry_id:'DEMO-A', text:"My sister Dana drove me to the clinic again today and waited with me, which kept me from skipping the appointment."},
  {segment_id:'DEMO-002', entry_id:'DEMO-A', text:"I wanted to call my mom after the craving hit but I know she thinks I will fail, so I never did."},
  {segment_id:'DEMO-003', entry_id:'DEMO-B', text:"Nobody checks on me anymore. I sat in the dark, barely ate, and did not sleep much for two nights."},
  {segment_id:'DEMO-004', entry_id:'DEMO-B', text:"My family had dinner without me. Later Marcus, my sponsor, texted to say sorry he missed my call and asked how I was holding up."},
  {segment_id:'DEMO-005', entry_id:'DEMO-C', text:"Walked the dog, made the bed, paid the rent late. Small wins but the day still felt heavy and I lost track of time."},
  {segment_id:'DEMO-006', entry_id:'DEMO-C', text:"He shouted again last night and I stopped speaking to him. This morning he apologized and said he will go to counseling with me."}
];

/* ===================================================================== */
const LS = 'eh4:';
const STATE = {
  screen:'start', coder:'', segments:[], codings:{}, idx:0,
  info:{}, warnings:[], opened:0, backendNote:'', inclText:false
};

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function saveCodings(){
  if(!STATE.coder) return;
  const ok = lsSet(LS+'codings:'+STATE.coder, JSON.stringify(STATE.codings));
  if(!ok) STATE.backendNote = 'Browser storage is unavailable. Export a backup often.';
}
function loadCodings(){
  const raw = lsGet(LS+'codings:'+STATE.coder);
  try{ STATE.codings = raw ? JSON.parse(raw) : {}; }catch(e){ STATE.codings = {}; }
}

/* ---------- blank structures ---------- */
function blankActor(){
  const a = {};
  ACTOR_FIELDS.forEach(f=>{
    if(f.type==='yn') a[f.id] = f.gate ? '' : 'No';
    else a[f.id] = '';
  });
  a.Other_Role = '';
  return a;
}
function blankCoding(){
  return {hasActor:'', Collective_Mentioned:'No', Generalized_Other_Mentioned:'No', actors:[], done:false, seconds:0, coded_at:''};
}
function cur(){ return STATE.segments[STATE.idx]; }
function curCoding(){
  const s = cur();
  if(!STATE.codings[s.segment_id]) STATE.codings[s.segment_id] = blankCoding();
  return STATE.codings[s.segment_id];
}

/* ---------- file loading ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else if(c==='\r'){ }
      else f+=c;
    }
  }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function normaliseSegments(arr){
  const out=[];
  arr.forEach((o,i)=>{
    const id = o.segment_id ?? o.id ?? o.SegmentID;
    const t  = o.text ?? o.segment_text ?? o.Text;
    if(id==null || !t) return;
    out.push({segment_id:String(id), entry_id:String(o.entry_id ?? o.entry ?? ''), text:String(t)});
  });
  return out;
}
async function readSegmentsFile(file){
  const text = await file.text();
  let arr;
  if(/\.json$/i.test(file.name)){
    arr = JSON.parse(text);
    if(!Array.isArray(arr)) arr = arr.segments || [];
  } else {
    const rows = parseCSV(text);
    const head = rows.shift().map(h=>h.trim());
    arr = rows.filter(r=>r.length>1).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=r[i]); return o; });
  }
  return normaliseSegments(arr);
}

/* ---------- rendering ---------- */
function topbar(sub){
  const done = STATE.segments.filter(s=>STATE.codings[s.segment_id]&&STATE.codings[s.segment_id].done).length;
  const n = STATE.segments.length;
  return `<header class="top"><h1>Family Ontology Coder <span class="small">· ${esc(GUIDE_VERSION)}</span></h1>
    <div class="meta">${esc(sub||'')}${n?` · ${done} of ${n} done`:''}</div></header>
    ${n?`<div class="bar" aria-hidden="true"><i style="width:${Math.round(100*done/n)}%"></i></div><div style="height:14px"></div>`:''}`;
}
function render(){
  const y = window.scrollY;
  const app = document.getElementById('app');
  if(STATE.screen==='start') app.innerHTML = viewStart();
  else if(STATE.screen==='code') app.innerHTML = viewCode();
  else if(STATE.screen==='list') app.innerHTML = viewList();
  else if(STATE.screen==='export') app.innerHTML = viewExport();
  bind();
  window.scrollTo(0,y);
}

function viewStart(){
  return `${topbar('Pilot coding tool')}
  <div class="card">
    <div class="lbl">1. Your coder name or initials</div>
    <input type="text" id="coderName" value="${esc(STATE.coder)}" placeholder="e.g. JG, MH, AI" style="max-width:260px">
    <div class="lbl" style="margin-top:16px">2. Load the segment file</div>
    <input type="file" id="segFile" accept=".json,.csv">
    <p class="small">A .json or .csv with columns <b>segment_id</b>, <b>text</b> and optionally <b>entry_id</b>. The file stays on your computer. The page never uploads it, and diary text is not stored in the browser, so you must reload the file each time you return. Your codes are kept in this browser and can be exported.</p>
    ${STATE.segments.length?`<p class="done">Loaded ${STATE.segments.length} segments.</p>`:''}
    ${STATE.warnings.map(w=>`<div class="warn">${esc(w)}</div>`).join('')}
    <div class="btnrow">
      <button class="primary" id="startBtn" ${STATE.segments.length&&STATE.coder?'':'disabled'}>Start / continue coding</button>
      <button class="ghost" id="demoBtn">Try 6 practice segments</button>
    </div>
  </div>
  <div class="card">
    <div class="lbl">Resume on another computer</div>
    <p class="small" style="margin-top:0">Import a backup (.json) made with "Export backup". It merges into your current codes for the coder name above.</p>
    <input type="file" id="bkFile" accept=".json">
  </div>`;
}

function infoBtn(key){ return `<button class="info" data-info="${key}" type="button">definition</button>`; }
function ynRow(name, val, extraAttr){
  return `<div class="opts" role="radiogroup">` + YN.map(v=>
    `<label class="opt ${v==='Yes'?'yes':''}"><input type="radio" name="${name}" value="${v}" ${val===v?'checked':''} ${extraAttr||''}><span>${v}</span></label>`).join('') + `</div>`;
}

function fieldHTML(f, a, ai){
  const key = ai+'_'+f.id;
  const name = f.label || f.id;
  const dag = f.prov ? '<span class="prov" title="Wording still being confirmed in the guide">†</span>' : '';
  const open = STATE.info[key] ? `<div class="defn"><b>Means:</b> ${esc(f.def)}<br><b>Code it when:</b> ${esc(f.when)}</div>` : '';
  let control='';
  if(f.type==='text'){
    control = `<input type="text" data-a="${ai}" data-f="${f.id}" value="${esc(a[f.id])}">` +
      (f.id==='Actor_Mention' ? `<div style="margin-top:5px"><button class="small ghost" type="button" data-use="${ai}">Use selected text</button></div>`:'');
  } else if(f.type==='area'){
    control = `<textarea data-a="${ai}" data-f="${f.id}" placeholder="Quote the shortest phrase behind each Yes">${esc(a[f.id])}</textarea>`;
  } else if(f.type==='role'){
    control = `<select data-a="${ai}" data-f="${f.id}"><option value="">Choose a role…</option>` +
      ROLES.map(r=>`<option ${a[f.id]===r?'selected':''}>${esc(r)}</option>`).join('') + `</select>` +
      (a[f.id]==='Other_Role' ? `<input type="text" style="margin-top:6px" data-a="${ai}" data-f="Other_Role" placeholder="Describe the role (also put it in Coder_Notes)" value="${esc(a.Other_Role)}">`:'');
  } else if(f.type==='yn'){
    control = ynRow('a'+ai+'_'+f.id, a[f.id], `data-a="${ai}" data-f="${f.id}"`);
  } else if(f.type==='enum'){
    control = `<div class="opts" role="radiogroup">` + f.values.map(v=>
      `<label class="opt"><input type="radio" name="a${ai}_${f.id}" value="${v}" ${a[f.id]===v?'checked':''} data-a="${ai}" data-f="${f.id}"><span>${esc(v)}</span></label>`).join('') + `</div>`;
  }
  return `<div class="field"><div class="fhead"><span class="fname">${esc(name)}${dag}</span>${infoBtn(key)}</div>${open}${control}</div>`;
}

function actorHTML(a, ai){
  let html = `<div class="card actor"><div class="actorhead"><span class="tag">Person ${ai+1}${a.Actor_Mention?': '+esc(a.Actor_Mention):''}</span>
    <button class="small ghost" type="button" data-rm="${ai}">Remove this person</button></div>`;
  let gatedOpen=false;
  FIELDS.forEach(f=>{
    if(f.sec){
      if(gatedOpen){ html+='</div>'; gatedOpen=false; }
      html += `<div class="lbl" style="margin-top:14px"><b>${esc(f.secTitle)}</b></div><div class="secnote">${esc(f.secNote)}</div>`;
      return;
    }
    if(f.gate){
      if(a[f.gate]!=='Yes'){ return; }
      if(!gatedOpen){ html+='<div class="gated">'; gatedOpen=true; }
    } else if(gatedOpen){ html+='</div>'; gatedOpen=false; }
    html += fieldHTML(f, a, ai);
  });
  if(gatedOpen) html+='</div>';
  return html + '</div>';
}

function viewCode(){
  const s = cur(), c = curCoding();
  const n = STATE.segments.length;
  const segFieldsHTML = SEG_FIELDS.map(f=>{
    const key='seg_'+f.id;
    const open = STATE.info[key] ? `<div class="defn"><b>Means:</b> ${esc(f.def)}<br><b>Code it when:</b> ${esc(f.when)}</div>`:'';
    return `<div class="field"><div class="fhead"><span class="fname">${f.id}</span>${infoBtn(key)}</div>${open}${ynRow('seg_'+f.id, c[f.id], `data-seg="${f.id}"`)}</div>`;
  }).join('');
  const warn = STATE.warnings.length ? `<div class="warn"><b>Check before saving:</b><ul>${STATE.warnings.map(w=>`<li>${esc(w.text||w)}</li>`).join('')}</ul>
      ${STATE.warnings.every(w=>w.soft)?'<div class="btnrow"><button class="primary small" id="forceSave">Save anyway</button></div>':''}</div>`:'';
  return `${topbar('Segment '+(STATE.idx+1)+' of '+n+' · '+STATE.coder)}
  <div class="card stick">
    <div class="lbl">Segment ${esc(s.segment_id)}${s.entry_id?' · entry '+esc(s.entry_id):''}${c.done?' · <span class="done">already saved (editing)</span>':''}</div>
    <div class="seg" id="segText">${esc(s.text)}</div>
  </div>
  <div class="card">
    <div class="lbl"><b>Segment-level flags</b> (copied to every row of this segment)</div>
    ${segFieldsHTML}
    <div class="field"><div class="fhead"><span class="fname">Does the segment mention an individual person (other than the diarist)?</span>${infoBtn('seg_has')}</div>
      ${STATE.info['seg_has']?`<div class="defn">Rules 3 and 4. Any individual human: named, role-based, generic singular, or pronoun-only. Not the diarist, not collectives alone, not pets, objects, institutions or chatbots. If none, you get one placeholder row and only the two flags above are coded.</div>`:''}
      <div class="opts" role="radiogroup">
        <label class="opt yes"><input type="radio" name="hasActor" value="Yes" ${c.hasActor==='Yes'?'checked':''}><span>Yes, code each person</span></label>
        <label class="opt"><input type="radio" name="hasActor" value="No" ${c.hasActor==='No'?'checked':''}><span>No, placeholder row</span></label>
      </div></div>
  </div>
  ${c.hasActor==='Yes' ? c.actors.map((a,i)=>actorHTML(a,i)).join('') + `<div class="btnrow" style="margin-top:0"><button class="ghost" id="addActor" type="button">+ Add another person</button></div>` : ''}
  ${c.hasActor==='No' && c.Generalized_Other_Mentioned==='Yes' ? '<div class="warn">This segment will be flagged for second-pass coding.</div>':''}
  ${warn}
  <div class="btnrow">
    <button class="ghost" id="prevBtn" ${STATE.idx===0?'disabled':''}>← Previous</button>
    <button class="primary" id="saveNext">${STATE.idx===n-1?'Save':'Save and next'}</button>
    <button class="ghost" id="listBtn">Segment list</button>
    <button class="ghost" id="exportBtn">Export</button>
  </div>`;
}

function viewList(){
  const rows = STATE.segments.map((s,i)=>{
    const c = STATE.codings[s.segment_id];
    const st = c&&c.done ? '<span class="done">done</span>' : (c&&c.hasActor ? '<span class="todo">started</span>':'<span class="todo">not started</span>');
    return `<tr class="go" data-go="${i}"><td>${i+1}</td><td>${esc(s.segment_id)}</td><td>${esc(s.text.slice(0,90))}${s.text.length>90?'…':''}</td><td>${st}</td></tr>`;
  }).join('');
  return `${topbar('Segment list · '+STATE.coder)}
  <div class="card"><table class="list"><tr><th>#</th><th>ID</th><th>Text</th><th>Status</th></tr>${rows}</table>
  <div class="btnrow"><button class="ghost" id="backCode">Back to coding</button><button class="ghost" id="exportBtn">Export</button></div></div>`;
}

function viewExport(){
  const done = STATE.segments.filter(s=>STATE.codings[s.segment_id]&&STATE.codings[s.segment_id].done).length;
  return `${topbar('Export · '+STATE.coder)}
  <div class="card">
    <p style="margin-top:0">${done} segments saved. Send your CSV to Aish. Do not email it outside the project's approved channel.</p>
    <div class="btnrow">
      <button class="primary" id="dlCsv">Download CSV (one row per person per segment)</button>
      <button id="dlBackup">Export backup (.json)</button>
    </div>
    <label class="small" style="display:block;margin-top:10px"><input type="checkbox" id="inclText" ${STATE.inclText?'checked':''}> Include the segment text in the CSV (not recommended: leave unchecked so no diary text lands in your Downloads folder)</label>
    <p class="small">By default the CSV holds codes and segment IDs only. The text is joined back from the segment file later. The backup holds your codes only, with no diary text.</p>
    <div class="btnrow"><button class="ghost" id="backCode">Back to coding</button><button class="ghost" id="switchCoder">Switch coder</button></div>
  </div>`;
}

/* ---------- events ---------- */
function bind(){
  const $ = id => document.getElementById(id);
  const on = (id, fn) => { const e=$(id); if(e) e.addEventListener('click', fn); };

  if(STATE.screen==='start'){
    $('coderName').addEventListener('input', e=>{ STATE.coder = e.target.value.trim(); $('startBtn').disabled = !(STATE.segments.length && STATE.coder); });
    $('segFile').addEventListener('change', async e=>{
      const f = e.target.files[0]; if(!f) return;
      STATE.warnings=[];
      try{
        STATE.segments = await readSegmentsFile(f);
        if(!STATE.segments.length) STATE.warnings.push('No segments found. Needs columns segment_id and text.');
        const ids = new Set(STATE.segments.map(s=>s.segment_id));
        if(ids.size !== STATE.segments.length) STATE.warnings.push('Duplicate segment_id values found. Each segment needs a unique ID.');
      }catch(err){ STATE.warnings.push('Could not read that file: '+err.message); STATE.segments=[]; }
      if(STATE.coder) loadCodings();
      render();
    });
    $('bkFile').addEventListener('change', async e=>{
      const f=e.target.files[0]; if(!f) return;
      if(!STATE.coder){ alert('Enter your coder name first.'); return; }
      try{
        const b = JSON.parse(await f.text());
        loadCodings();
        Object.assign(STATE.codings, b.codings||{});
        saveCodings();
        STATE.warnings=['Backup imported: '+Object.keys(b.codings||{}).length+' segments.'];
      }catch(err){ STATE.warnings=['Could not read backup: '+err.message]; }
      render();
    });
    on('startBtn', ()=>{ loadCodings(); goFirstOpen(); });
    on('demoBtn', ()=>{
      STATE.segments = DEMO.slice();
      if(!STATE.coder) STATE.coder = 'practice';
      loadCodings(); STATE.idx=0; STATE.screen='code'; STATE.opened=Date.now(); STATE.warnings=[]; render();
    });
    return;
  }

  if(STATE.screen==='code'){
    document.querySelectorAll('[data-info]').forEach(b=>b.addEventListener('click', ()=>{
      const k=b.dataset.info; STATE.info[k]=!STATE.info[k]; render();
    }));
    document.querySelectorAll('input[name=hasActor]').forEach(r=>r.addEventListener('change', e=>{
      const c=curCoding(); c.hasActor=e.target.value;
      if(c.hasActor==='Yes' && !c.actors.length) c.actors.push(blankActor());
      STATE.warnings=[]; saveDraft(); render();
    }));
    document.querySelectorAll('[data-seg]').forEach(r=>r.addEventListener('change', e=>{
      curCoding()[e.target.dataset.seg]=e.target.value; saveDraft(); render();
    }));
    document.querySelectorAll('input[type=radio][data-a], select[data-a]').forEach(el=>el.addEventListener('change', e=>{
      setActorField(+el.dataset.a, el.dataset.f, el.value);
    }));
    document.querySelectorAll('input[type=text][data-a], textarea[data-a]').forEach(el=>el.addEventListener('input', e=>{
      const a=curCoding().actors[+el.dataset.a]; a[el.dataset.f]=el.value; saveDraft();
    }));
    document.querySelectorAll('[data-use]').forEach(b=>b.addEventListener('click', ()=>{
      const sel = (window.getSelection().toString()||'').trim();
      if(!sel){ alert('Select the words in the segment text first.'); return; }
      curCoding().actors[+b.dataset.use].Actor_Mention = sel; saveDraft(); render();
    }));
    document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{
      const c=curCoding(); if(!confirm('Remove this person row?')) return;
      c.actors.splice(+b.dataset.rm,1); if(!c.actors.length) c.hasActor=''; saveDraft(); render();
    }));
    on('addActor', ()=>{ curCoding().actors.push(blankActor()); saveDraft(); render(); });
    on('saveNext', ()=>trySave(false));
    on('forceSave', ()=>trySave(true));
    on('prevBtn', ()=>{ go(STATE.idx-1); });
    on('listBtn', ()=>{ STATE.screen='list'; render(); });
    on('exportBtn', ()=>{ STATE.screen='export'; render(); });
    return;
  }

  if(STATE.screen==='list'){
    document.querySelectorAll('[data-go]').forEach(r=>r.addEventListener('click', ()=>go(+r.dataset.go)));
    on('backCode', ()=>{ STATE.screen='code'; render(); });
    on('exportBtn', ()=>{ STATE.screen='export'; render(); });
    return;
  }

  if(STATE.screen==='export'){
    on('backCode', ()=>{ STATE.screen='code'; render(); });
    const it = $('inclText'); if(it) it.addEventListener('change', e=>{ STATE.inclText = e.target.checked; });
    on('dlCsv', downloadCSV);
    on('dlBackup', downloadBackup);
    on('switchCoder', ()=>{ STATE.screen='start'; STATE.segments=[]; STATE.coder=''; STATE.codings={}; render(); });
  }
}

function setActorField(ai, fid, val){
  const a = curCoding().actors[ai];
  a[fid]=val;
  const f = ACTOR_FIELDS.find(x=>x.id===fid);
  // gated fields: clear when gate goes to No, default care types to No when gate goes to Yes
  ACTOR_FIELDS.filter(g=>g.gate===fid).forEach(g=>{
    if(val==='Yes'){ if(g.type==='yn' && a[g.id]==='') a[g.id]='No'; }
    else a[g.id]='';
  });
  if(fid==='Actor_Role' && val!=='Other_Role') a.Other_Role='';
  STATE.warnings=[]; saveDraft();
  if(f && (f.gate || ACTOR_FIELDS.some(g=>g.gate===fid) || fid==='Actor_Role')) render();
}

function saveDraft(){ saveCodings(); }

function go(i){
  if(i<0 || i>=STATE.segments.length) return;
  accrueTime();
  STATE.idx=i; STATE.screen='code'; STATE.warnings=[]; STATE.opened=Date.now(); render();
  window.scrollTo(0,0);
}
function goFirstOpen(){
  let i = STATE.segments.findIndex(s=>!(STATE.codings[s.segment_id]&&STATE.codings[s.segment_id].done));
  if(i<0) i=0;
  STATE.idx=i; STATE.screen='code'; STATE.warnings=[]; STATE.opened=Date.now(); render();
}
function accrueTime(){
  if(!STATE.opened || STATE.screen!=='code') return;
  const c = STATE.segments.length ? STATE.codings[cur().segment_id] : null;
  if(c && !c.done){
    const dt = Math.min(600, Math.round((Date.now()-STATE.opened)/1000)); // cap idle time at 10 min
    c.seconds = (c.seconds||0) + dt;
  }
  STATE.opened = Date.now();
}

/* ---------- validation + save ---------- */
function validate(c){
  const hard=[], soft=[];
  if(!c.hasActor) hard.push({text:'Answer whether the segment mentions an individual person.'});
  if(c.hasActor==='Yes'){
    c.actors.forEach((a,i)=>{
      const tag='Person '+(i+1)+': ';
      ACTOR_FIELDS.forEach(f=>{
        if(f.gate && a[f.gate]!=='Yes') return;
        if(f.req && !String(a[f.id]).trim()) hard.push({text:tag+f.id+' needs a value.'});
        if(f.type==='yn' && !a[f.id]) hard.push({text:tag+(f.label||f.id)+' needs Yes or No.'});
      });
      if(a.Actor_Role==='Other_Role' && !a.Other_Role.trim() && !/role/i.test(a.Coder_Notes||'') && !(a.Coder_Notes||'').trim())
        soft.push({text:tag+'Other_Role chosen: describe the role.', soft:1});
      NOTES_FIELDS.forEach(id=>{
        if(a[id]==='Yes' && !String(a.Coder_Notes||'').trim()){
          if(!soft.some(w=>w.text.startsWith(tag+'Coder_Notes')))
            soft.push({text:tag+'Coder_Notes is empty, but '+id+' (and maybe others) is Yes. Rule 11: quote the shortest supporting phrase.', soft:1});
        }
      });
      if(a.Care_Content_Present==='Yes' && !CARE_TYPES.some(t=>a[t.id]==='Yes'))
        soft.push({text:tag+'Care is present but no care type is Yes. Use Other_Care and describe it if none fits.', soft:1});
    });
  }
  return {hard, soft};
}
function trySave(force){
  const c = curCoding();
  const v = validate(c);
  if(v.hard.length){ STATE.warnings = v.hard; render(); return; }
  if(v.soft.length && !force){ STATE.warnings = v.soft; render(); return; }
  accrueTime();
  c.done=true; c.coded_at=new Date().toISOString();
  STATE.warnings=[]; saveCodings();
  if(STATE.idx < STATE.segments.length-1){ go(STATE.idx+1); }
  else { STATE.screen='export'; render(); }
}

/* ---------- export ---------- */
function csvCell(v){ v = v==null?'':String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function buildCSV(){
  const cols = ['segment_id','entry_id','coder','row_n','row_type','segment_text','Second_Pass_Flag',
    ...SEG_FIELDS.map(f=>f.id), 'Actor_Mention','Actor_Name','Actor_Role','Other_Role',
    ...ACTOR_FIELDS.filter(f=>!['Actor_Mention','Actor_Name','Actor_Role','Coder_Notes'].includes(f.id)).map(f=>f.id),
    'Coder_Notes','seconds_on_segment','coded_at','guide_version'];
  const lines=[cols.join(',')];
  STATE.segments.forEach(s=>{
    const c = STATE.codings[s.segment_id];
    if(!c || !c.done) return;
    const base = {segment_id:s.segment_id, entry_id:s.entry_id, coder:STATE.coder, segment_text:(STATE.inclText ? s.text : ''),
      Collective_Mentioned:c.Collective_Mentioned, Generalized_Other_Mentioned:c.Generalized_Other_Mentioned,
      Second_Pass_Flag: c.Generalized_Other_Mentioned==='Yes' ? 'Yes':'No',
      seconds_on_segment:c.seconds||0, coded_at:c.coded_at, guide_version:GUIDE_VERSION};
    const rows = c.hasActor==='Yes'
      ? c.actors.map((a,i)=>Object.assign({}, base, a, {row_n:i+1, row_type:'actor'}))
      : [Object.assign({}, base, {row_n:1, row_type:'placeholder'})];
    rows.forEach(r=>lines.push(cols.map(k=>csvCell(r[k])).join(',')));
  });
  return lines.join('\r\n');
}
function download(name, text, mime){
  const blob = new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
}
function downloadCSV(){
  const d = new Date().toISOString().slice(0,10);
  download('eh_v4_coding_'+STATE.coder+'_'+d+'.csv', '﻿'+buildCSV(), 'text/csv;charset=utf-8');
}
function downloadBackup(){
  const d = new Date().toISOString().slice(0,10);
  download('eh_v4_backup_'+STATE.coder+'_'+d+'.json', JSON.stringify({coder:STATE.coder, guide:GUIDE_VERSION, codings:STATE.codings}), 'application/json');
}

render();
</script>
</body>
